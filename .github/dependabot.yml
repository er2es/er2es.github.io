version: 2
updates:
  # the app's dependencies: one pull request a week, the Angular packages together
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      angular:
        patterns: ["@angular/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "@axe-core/*", "jsdom"]
      linting:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "angular-eslint"]
    ignore:
      # Angular 22 supports TypeScript 6.0 only, and the type definitions follow the Node version in .nvmrc
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # the actions the CI uses
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(ci)"

  # the dev container image
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
