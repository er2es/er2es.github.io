<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Szabó József</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* mirrors _tokens.scss @mixin dark so critical CSS carries the dark theme */
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #000000; --bg-2: #1c1c1e; --bg-3: #2c2c2e; --fg: #f5f5f7; --fg-2: #b8b8bd; --line: rgba(255, 255, 255, 0.16); --accent: #34d65c; --accent-fg: #000000; --glass-bg: rgba(28, 28, 30, 0.7); --glass-edge: rgba(255, 255, 255, 0.22); --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.55); } }
    :root[data-theme='dark'] { color-scheme: dark; --bg: #000000; --bg-2: #1c1c1e; --bg-3: #2c2c2e; --fg: #f5f5f7; --fg-2: #b8b8bd; --line: rgba(255, 255, 255, 0.16); --accent: #34d65c; --accent-fg: #000000; --glass-bg: rgba(28, 28, 30, 0.7); --glass-edge: rgba(255, 255, 255, 0.22); --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.55); }
    :root[data-theme='light'] { color-scheme: light; }
  </style>
  <script>try{window.__ck=document.cookie}catch(e){window.__ck=''}</script>
  <script>try{var l=navigator.languages&&navigator.languages[0];if(location.pathname==='/'&&l&&/^hu(-|$)/i.test(l)&&!sessionStorage.getItem('cv:lang'))location.replace('/hu/'+location.search+location.hash)}catch(e){}</script>
  <script>try{var t=localStorage.getItem('cv:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
